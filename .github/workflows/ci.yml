name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check inline JS
        run: |
          python3 - <<'EOF'
          import re
          html = open('index.html', encoding='utf-8').read()
          m = re.search(r'(?s)<script>(.*?)</script>', html)
          assert m, 'inline <script> not found'
          open('/tmp/app.js', 'w', encoding='utf-8').write(m.group(1))
          print('extracted', len(m.group(1)), 'chars')
          EOF
          node --check /tmp/app.js

      - name: Unit tests (CORE pure functions)
        run: |
          node scripts/extract-core.mjs
          npm ci
          npm test

      - name: Validate manifest & sw.js
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
          node --check sw.js

      - name: Icon files present
        run: |
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f icons/icon-maskable-512.png
          echo "icons ok"
